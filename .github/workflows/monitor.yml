name: Monitor

on:
  schedule:
    - cron: '17 * * * *' # hourly; GitHub may delay or skip some runs, so the gaps can be longer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the config
        run: npm run validate
      - name: Check every project
        id: checks
        run: npm run check
      - name: Tell ntfy the result
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESULT: ${{ steps.checks.outcome }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$RESULT" = "success" ]; then
            # min priority: it shows on the ntfy dashboard but does not buzz the phone
            curl -fsS -H "Title: Uptime OK" -H "Priority: min" -H "Tags: white_check_mark" \
              -d "All checks passed. ${RUN}" "https://ntfy.sh/${NTFY_TOPIC}" || true
          else
            curl -fsS -H "Title: Uptime check FAILED" -H "Priority: high" -H "Tags: rotating_light" \
              -d "A project is down or slow. ${RUN}" "https://ntfy.sh/${NTFY_TOPIC}" || true
          fi
