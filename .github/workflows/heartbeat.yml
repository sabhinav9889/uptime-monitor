name: Heartbeat

# GitHub switches off scheduled workflows after 60 days without repository activity.
# This writes one small commit to a separate branch each month so the monitor stays on.
on:
  schedule:
    - cron: '43 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp to the heartbeat branch
        run: |
          git config user.name "uptime-monitor"
          git config user.email "uptime-monitor@users.noreply.github.com"
          git checkout -B heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add -f .heartbeat
          git commit -m "chore: monthly heartbeat"
          git push --force origin heartbeat
